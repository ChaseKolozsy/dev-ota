version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · AnkiDroid
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 build 2191 from main source e2c0e2f1. Adds bounded, revision-validated lookup caches, updated device-wide calibration and cleanup of timed-out lookup requests. Warm emulator lookup median improved from 1.058s to 0.491s; first lookup after restart still took 3.196s. Emulator calibration selected four workers; physical phone results must be measured separately. Preserves taps, expanded senses and scroll while Jev loads. Includes AnkiDroid and FFmpeg/FFprobe. APK SHA256 1b379e9e2911236419b812c92a38da2d4f2da2a949ead4b379f5ed5ad7498251; signer SHA256 cf65f2dc8f0ab9d721b2256eaf123178041e74b97e979dec3bca4d7aa3a6dbd4.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2191
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2191
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
