version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · AnkiDroid
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 build 2213 from main source 5638c86f. Fixes Generate appearing unresponsive when review fields are cleared; blanks use the advertised 1–3 defaults, invalid fields show errors beside Generate, and confirmation scrolls on smaller screens. Includes commentary source fixes, Jev prepared lookups, encrypted restart caching, AnkiDroid, FFmpeg and FFprobe. APK SHA256 3d6df39230d65dcb6e85eb44d3990066e0415f54401273e468f9b11f88098879.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2213
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2213
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
