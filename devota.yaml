version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · AnkiDroid
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 build 2175 from main source dfc4136d. Desktop and embedded Jev now use one morphology evidence policy. Language installation prepares an encrypted persistent word-lookup cache, including Android foreground protection. Cebuano 2.8.4 contains the original shared Gilatigo annotation. Includes AnkiDroid, FFmpeg/FFprobe and gesture models. APK SHA256 00d80c50c172edff82b19246bac1e2f383593ffdc75701581010ab2d94fef3d9; signer SHA256 cf65f2dc8f0ab9d721b2256eaf123178041e74b97e979dec3bca4d7aa3a6dbd4.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2175
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2175
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
