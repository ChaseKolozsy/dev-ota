version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · AnkiDroid
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 build 2211 from main source 3be871b0. Primer and Ogden commentary use the displayed Creative or linked family source. Fixes rejection of readable local Creative lessons when a downloaded content shard cannot open; storage errors no longer claim a Creative is missing. Purchase controls now wrap long translated labels and hints. Includes prior Jev prepared lookups, encrypted restart caching, AnkiDroid, FFmpeg and FFprobe. Physical Phone-server failure is still under investigation. APK SHA256 f59134949fabbc4129e334bd8b1e8145b0f3be7e228b57168e3ee58389807576.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2211
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2211
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
