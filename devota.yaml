version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · AnkiDroid
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 build 2209 from main source e3e76833. Fixes Primer and Ogden commentary generation from the currently displayed Creative lesson, including unapproved spec implementations and linked Blended Definitions. Resolves downloaded pack sources and preserves local commentary links without copying installed source bodies. Emulator 2208 verified both UI flows and six embedded-server source cases. Includes prior encrypted restart caching, Cebuano prepared lookup support, AnkiDroid, FFmpeg and FFprobe. APK SHA256 1e5f6c41730d5cd64fbaa40a04417807149ed8f1115a7c3d6e2e5fdffe97203c; signer SHA256 cf65f2dc8f0ab9d721b2256eaf123178041e74b97e979dec3bca4d7aa3a6dbd4.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2209
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://10.243.53.96:8002 --build-number 2209
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
