version: 1
roots:
  cradlespeak: /home/chase/Cradlespeak
  devota: /home/chase/dev-ota
  perfect-drivers-club: /home/chase/perfect-drivers-club
  whisper-notes: /home/chase/whisper-notes
apps:
  - id: cradlespeak
    root: cradlespeak
    label: Cradlespeak — main · Title audit
    packageName: io.github.chasekolozsy.cradlespeak
    notes: Signed ARM64 versionCode 8250 from main source cd0b8fe7. Includes the title audit fixes through the terminal pose timeout, tracked runtime WAV assets, and the rebuilt embedded server. Gesture calibration and language-pack publication remain in progress. APK SHA256 0cf46b53f4d0eec9cd6748fed4e23ea82b352f2b203f1fbb0badbd88c0802385.
    buildDirs:
      - app/build/app/outputs/flutter-apk
    build:
      workingDir: .
      commands:
        debug: scripts/build_android_apk.sh debug --lexical --trusted-http-origin http://127.0.0.1:18003 --build-number 6250
        release: scripts/build_android_apk.sh release --lexical --trusted-http-origin http://127.0.0.1:18003 --build-number 6250
  - id: devota
    root: devota
    label: DevOTA
    packageName: io.github.chasekolozsy.devota
    notes: DevOTA Android development server and terminal app.
    buildDirs:
      - app/dist/public
    build:
      workingDir: app
      commands:
        debug: ../scripts/build/devota-public-debug.sh
        release: ../scripts/build/devota-public-release.sh
  - id: perfect-drivers-club
    root: perfect-drivers-club
    label: Perfect Driver's Club
    packageName: com.perfectdriversclub
    notes: Driving companion relationship feedback app.
    buildDirs:
      - app/build/outputs/apk/debug
  - id: whisper-notes
    root: whisper-notes
    label: Whisper Notes
    packageName: io.github.chasekolozsy.whispernotes
    notes: Encrypted voice notes transcribed by a private home Whisper server.
    buildDirs:
      - dist/public
